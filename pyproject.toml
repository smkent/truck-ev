[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "truck-ev"
dynamic = ["version"]
description = "Truck EV conversion bits and parts"
readme = "README.md"
license = "LGPL-3.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Stephen Kent", email = "smkent@smkent.net" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Documentation",
  "Topic :: Software Development",
  "Topic :: Utilities",
  "Typing :: Typed",
]
keywords = []
dependencies = ["bdbox>=0.26.0", "build123d>=0.11"]

[project.urls]
Homepage = "https://github.com/smkent/truck-ev"
Repository = "https://github.com/smkent/truck-ev"
Issues = "https://github.com/smkent/truck-ev/issues"

[dependency-groups]
dev = [
  "bump-my-version>=1.3.0",
  "pysentry-rs>=0.4",
  "pytest>=9",
  "pytest-cov>=7",
  "pytest-sugar>=1",
  "pytest-xdist>=3",
  "ruff>=0.15",
  "syrupy>=5",
  "ty>=0.0.49",
]

[tool.bumpversion]
commit = false
tag = true
tag_name = "v{new_version}"
tag_message = ""
push = true

[tool.hatch.build.targets.sdist]
include = ["/truck_ev", "/tests", "*.md", "LICENSE"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.pysentry.ignore]
ids = [
  # Pillow 12.2.0 via threejs-materials via ocp-vscode
  "GHSA-62p4-gmf7-7g93",
  "GHSA-fj7v-r99m-22gq",
  "GHSA-jjj6-mw9f-p565",
  "GHSA-vjc4-5qp5-m44j",
  "PYSEC-2026-2253",
  "PYSEC-2026-2254",
  "PYSEC-2026-2255",
  "PYSEC-2026-2256",
  "PYSEC-2026-2257",
  "PYSEC-2026-3451",
  "PYSEC-2026-3452",
  "PYSEC-2026-3453",
  "PYSEC-2026-3454",
]

[tool.pytest]
addopts = [
  "-ra",
  "--cov=truck_ev",
  "--strict-config",
  "--strict-markers",
  "--numprocesses",
  "auto",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["truck_ev"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "@abstractmethod"]

[tool.ruff]
line-length = 79
output-format = "concise"
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
  "COM812", # Trailing comma missing
  "CPY001", # Missing copyright notice at top of file
  "D1",     # Missing docstring presence rules
  "EM",     # flake8-errmsg
  "G004",   # Logging statement uses f-string
  "PLR",    # pylint Refactor
  "S607",   # Starting a process with a partial executable path
  "TD",     # flake8-todos
  "TRY003", # Avoid specifying long messages outside the exception class
]

[tool.ruff.lint.isort]
known-first-party = ["truck_ev"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "ARG",  # flake8-unused-arguments
  "S101", # Use of assert detected
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
include = ["truck_ev/", "tests/"]

[tool.ty.terminal]
error-on-warning = true
output-format = "concise"

[tool.uv]
default-groups = ["dev"]

[tool.uv-dynamic-versioning]
pattern = "default-unprefixed"
fallback-version = "0.0.0"
